name: Build & Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          go test ./... -count=1 -race -v -coverprofile=coverage.out -covermode=atomic

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Build binary for integration tests
        run: go build -o xyrun ./cmd/xyrun

      - name: Run integration tests
        run: go test ./internal/runner/... -tags integration -v -count=1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs:
      - test

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goos: linux
            arch: x86
            goarch: 386
            ext: ""

          - os: linux
            goos: linux
            arch: x64
            goarch: amd64
            ext: ""

          - os: linux
            goos: linux
            arch: arm64
            goarch: arm64
            ext: ""

          - os: darwin
            goos: darwin
            arch: x64
            goarch: amd64
            ext: ""

          - os: darwin
            goos: darwin
            arch: arm64
            goarch: arm64
            ext: ""

          - os: windows
            goos: windows
            arch: x86
            goarch: 386
            ext: ".exe"

          - os: windows
            goos: windows
            arch: x64
            goarch: amd64
            ext: ".exe"

          - os: windows
            goos: windows
            arch: arm64
            goarch: arm64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          mkdir -p dist

          VERSION="${{ steps.version.outputs.version }}"

          LDFLAGS="-s -w"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            LDFLAGS="${LDFLAGS} -X main.version=${VERSION}"
          fi

          OUTPUT="dist/xyrun-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

          go build \
            -trimpath \
            -ldflags "${LDFLAGS}" \
            -o "${OUTPUT}" \
            ./cmd/xyrun

      - uses: actions/upload-artifact@v4
        with:
          name: xyrun-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
